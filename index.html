<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LAS PILCHAS</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #000;
      color: #fff;
      margin: 0;
      text-align: center;
    }

    /* Header */
    .hero {
      padding: 20px;
      background: #111;
    }

    .hero img.logo {
      width: 80px;
      max-width: 100px;
      margin-bottom: 10px;
    }

    /* Productos */
    .productos {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      margin: 20px 0;
      gap: 15px;
      padding: 0 10px;
    }

    .card {
      background: #111;
      border-radius: 15px;
      padding: 15px;
      width: 45%;
      max-width: 220px;
      transition: 0.3s;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .card img {
      width: 100%;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .card:hover {
      transform: scale(1.05);
    }

    .card h3 {
      margin: 5px 0;
    }

    .card p {
      margin: 5px 0;
      font-weight: bold;
    }

    button {
      margin-top: 10px;
      padding: 12px;
      width: 100%;
      border: none;
      border-radius: 10px;
      background: #fff;
      color: #000;
      font-weight: bold;
      cursor: pointer;
    }

    button.delete {
      background: red;
      color: white;
      padding: 5px 10px;
      margin-left: 10px;
      border-radius: 5px;
    }

    /* Carrito */
    #carrito {
      list-style: none;
      padding: 0;
      margin: 10px 20px;
      text-align: left;
    }

    #total {
      font-weight: bold;
      margin-bottom: 20px;
    }

    .comprar {
      margin: 10px auto 30px auto;
      padding: 15px;
      width: 90%;
      max-width: 300px;
      background: #25D366;
      color: #fff;
      font-weight: bold;
      border-radius: 15px;
      font-size: 16px;
      border: none;
      cursor: pointer;
      display: block;
    }

    /* WhatsApp fijo */
    .wsp {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #25D366;
      color: #fff;
      font-size: 25px;
      padding: 15px;
      border-radius: 50%;
      text-decoration: none;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    /* Responsive */
    @media (max-width: 600px) {
      .card {
        width: 90%;
      }
      .hero img.logo {
        width: 60px;
      }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="hero">
    <img src="logo.png" class="logo" alt="Logo LAS PILCHAS">
    <h1>LAS PILCHAS</h1>
  </div>

  <!-- Productos -->
  <div class="productos">
    <div class="card">
      <img src="nike-roja.jpeg" alt="Nike SB Roja">
      <h3>Nike SB Roja</h3>
      <p>$15000</p>
      <button onclick="agregarAlCarrito('Nike SB Roja', 15000)">Agregar</button>
    </div>

    <div class="card">
      <img src="nike-negra.jpeg" alt="Nike SB Negra">
      <h3>Nike SB Negra</h3>
      <p>$15000</p>
      <button onclick="agregarAlCarrito('Nike SB Negra', 15000)">Agregar</button>
    </div>

    <div class="card">
      <img src="perfume.jpeg" alt="Perfume">
      <h3>Perfume</h3>
      <p>$4000</p>
      <button onclick="agregarAlCarrito('Perfume', 4000)">Agregar</button>
    </div>

    <div class="card">
      <img src="reloj-azul.jpeg" alt="Reloj Azul">
      <h3>Reloj Azul</h3>
      <p>$10000</p>
      <button onclick="agregarAlCarrito('Reloj Azul', 10000)">Agregar</button>
    </div>
  </div>

  <!-- Carrito -->
  <h2>Carrito 🛒</h2>
  <ul id="carrito"></ul>
  <p id="total">Total: $0</p>

  <button class="comprar" onclick="comprar()">Comprar por WhatsApp</button>

  <!-- WhatsApp -->
  <a href="https://wa.me/5492216193015" class="wsp" target="_blank">💬</a>

  <script>
    let carrito = [];

    function agregarAlCarrito(nombre, precio) {
      carrito.push({nombre, precio});
      actualizar();
    }

    function actualizar() {
      const lista = document.getElementById('carrito');
      const total = document.getElementById('total');
      lista.innerHTML = '';
      let suma = 0;

      carrito.forEach((item, index) => {
        const li = document.createElement('li');
        li.textContent = item.nombre + " - $" + item.precio;

        const btn = document.createElement('button');
        btn.textContent = '❌';
        btn.className = 'delete';
        btn.onclick = () => eliminar(index);

        li.appendChild(btn);
        lista.appendChild(li);

        suma += item.precio;
      });

      total.textContent = 'Total: $' + suma;
    }

    function eliminar(index) {
      carrito.splice(index,1);
      actualizar();
    }

    function comprar() {
      if(carrito.length === 0){
        alert('Tu carrito está vacío 😢');
        return;
      }
      let mensaje = "Hola! Quiero comprar:\n";
      carrito.forEach(item => mensaje += `- ${item.nombre} $${item.precio}\n`);
      window.open("https://wa.me/5492216193015?text=" + encodeURIComponent(mensaje));
    }
  </script>

</body>
</html>
