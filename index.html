<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LAS PILCHAS</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: black;
      color: white;
      margin: 0;
      text-align: center;
    }

    .hero {
      padding: 20px;
      background: #111;
    }

    .logo {
      width: 100px;
    }

    .productos {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      margin: 20px 0;
    }

    .card {
      background: #111;
      margin: 10px;
      padding: 15px;
      border-radius: 15px;
      width: 90%;
      max-width: 250px;
      transition: 0.3s;
    }

    .card img {
      width: 100%;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .card:hover {
      transform: scale(1.05);
    }

    button {
      margin-top: 10px;
      padding: 12px;
      width: 100%;
      border: none;
      background: white;
      color: black;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    .delete {
      background: red;
      color: white;
      padding: 5px 10px;
      margin-left: 10px;
      border-radius: 5px;
      cursor: pointer;
    }

    #carrito {
      list-style: none;
      padding: 0;
      margin: 10px 0;
    }

    .comprar {
      margin: 20px;
      padding: 15px;
      width: 90%;
      max-width: 300px;
      background: #25D366;
      color: white;
      border-radius: 15px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      border: none;
    }

    .wsp {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #25D366;
      color: white;
      font-size: 25px;
      padding: 15px;
      border-radius: 50%;
      text-decoration: none;
    }
  </style>
</head>
<body>

<div class="hero">
  <img src="logo.png" class="logo" alt="Logo LAS PILCHAS">
  <h1>LAS PILCHAS</h1>
</div>

<div class="productos">

  <div class="card">
    <img src="WhatsApp Image 2026-03-25 at 22.47.57.jpeg" alt="Nike SB Negra">
    <h3>Nike SB Negra</h3>
    <p>$15000</p>
    <button onclick="agregarAlCarrito('Nike SB Negra', 15000)">Agregar</button>
  </div>

  <div class="card">
    <img src="PERFUME_CORRECTO.jpeg" alt="Perfume">
    <h3>Perfume</h3>
    <p>$4000</p>
    <button onclick="agregarAlCarrito('Perfume', 4000)">Agregar</button>
  </div>

  <div class="card">
    <img src="RELOJ_CORRECTO.jpeg" alt="Reloj Azul">
    <h3>Reloj Azul</h3>
    <p>$10000</p>
    <button onclick="agregarAlCarrito('Reloj Azul', 10000)">Agregar</button>
  </div>

</div>

<h2>Carrito 🛒</h2>
<ul id="carrito"></ul>
<p id="total">Total: $0</p>

<button onclick="comprar()" class="comprar">Comprar por WhatsApp</button>

<a href="https://wa.me/5492216193015" class="wsp" target="_blank">💬</a>

<script>
  let carrito = [];

  function agregarAlCarrito(nombre, precio) {
    carrito.push({ nombre, precio });
    actualizar();
  }

  function actualizar() {
    const lista = document.getElementById("carrito");
    const total = document.getElementById("total");

    lista.innerHTML = "";
    let suma = 0;

    carrito.forEach((item, index) => {
      const li = document.createElement("li");
      li.textContent = item.nombre + " - $" + item.precio;

      const btn = document.createElement("button");
      btn.textContent = "❌";
      btn.className = "delete";
      btn.onclick = () => eliminar(index);

      li.appendChild(btn);
      lista.appendChild(li);

      suma += item.precio;
    });

    total.textContent = "Total: $" + suma;
  }

  function eliminar(index) {
    carrito.splice(index, 1);
    actualizar();
  }

  function comprar() {
    if (carrito.length === 0) {
      alert("Tu carrito está vacío 😢");
      return;
    }

    let mensaje = "Hola! Quiero comprar:\n";
    carrito.forEach(item => {
      mensaje += `- ${item.nombre} $${item.precio}\n`;
    });

    window.open("https://wa.me/5492216193015?text=" + encodeURIComponent(mensaje));
  }
</script>

</body>
</html>
