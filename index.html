<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>LAS PILCHAS</title>

  <style>
    body {
      font-family: Arial;
      background: black;
      color: white;
      text-align: center;
    }

    .card {
      display: inline-block;
      background: #111;
      margin: 15px;
      padding: 15px;
      border-radius: 15px;
      width: 220px;
    }

    button {
      margin-top: 10px;
      padding: 10px;
      border: none;
      background: white;
      color: black;
      border-radius: 10px;
      cursor: pointer;
    }

    .wsp {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #25D366;
      color: white;
      font-size: 25px;
      padding: 15px;
      border-radius: 50%;
      text-decoration: none;
    }
  </style>
</head>
<body>

<h1>LAS PILCHAS</h1>

<div class="card">
  <h3>Remera Negra</h3>
  <p>$5000</p>
  <button onclick="agregarAlCarrito('Remera Negra', 5000)">Agregar</button>
</div>

<div class="card">
  <h3>Buzo Oversize</h3>
  <p>$12000</p>
  <button onclick="agregarAlCarrito('Buzo Oversize', 12000)">Agregar</button>
</div>

<h2>Carrito 🛒</h2>
<ul id="carrito"></ul>
<p id="total">Total: $0</p>

<button onclick="comprar()">Comprar por WhatsApp</button>

<a href="https://wa.me/5492216193015" class="wsp" target="_blank">💬</a>

<script>
let carrito = [];

function agregarAlCarrito(nombre, precio) {
  carrito.push({ nombre, precio });
  actualizar();
}

function actualizar() {
  const lista = document.getElementById("carrito");
  const total = document.getElementById("total");

  lista.innerHTML = "";
  let suma = 0;

  carrito.forEach((item) => {
    const li = document.createElement("li");
    li.textContent = item.nombre + " - $" + item.precio;
    lista.appendChild(li);
    suma += item.precio;
  });

  total.textContent = "Total: $" + suma;
}

function comprar() {
  let mensaje = "Hola quiero comprar:\n";

  carrito.forEach(item => {
    mensaje += "- " + item.nombre + " $" + item.precio + "\n";
  });

  window.open("https://wa.me/5492216193015?text=" + encodeURIComponent(mensaje));
}
</script>

</body>
</html>
